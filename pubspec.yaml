name: flylog
description: "FlyLog – rodinná kronika zážitků, výletů, kulturních akcí a vícedenních dovolených."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  # UI & Adaptivita
  # Pozn.: flutter_adaptive_scaffold je od 2025 oficiálně "discontinued". Je ponechán
  # v závislostech dle zadání, ale vlastní Z Fold scaffold (core/responsive) je postaven
  # nad nativními widgety (NavigationBar / NavigationRail), takže na balíčku nezávisí.
  flutter_adaptive_scaffold: ^0.1.4
  intl: ^0.19.0
  cupertino_icons: ^1.0.8

  # Lokální data & Stav
  shared_preferences: ^2.2.3
  path_provider: ^2.1.3
  share_plus: ^10.0.0
  file_picker: ^13.3.3

  # Sítě & AI
  http: ^1.2.1
  google_generative_ai: ^0.4.0

  # Média & EXIF
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0
  exif: ^3.3.0

  # Poloha
  geolocator: ^12.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

